[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "data-intelligence-platform"
version = "1.1.0"
description = "Integrated data intelligence, artificial intelligence and machine learning platform"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dip = "dip.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
